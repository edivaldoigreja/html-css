<html lang="pt-br">
<head>

    <title>Desafio-Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 300px;
            
            

            

        }
        th{
            border: 1px solid black;
            padding: 15px;
            text-align: center;
            

        }

            </tr>

            <tr>

                <tr>
