<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
</head>
<body>

    <h1>Uso de tabelas grandes</h1>
    <!-- ANATOMIAS PARA TABELAS GRANDES
     TABLE
     THEAD( DENTRO DA CABEÇA EU POSSO TER TAGS COMO TR,TH,TD)
     TBODY( DENTRO DO CORPO TAMBÉM POSSSO TER AS TAGS ANTERIORES)
     TFOOT( E NO RODAPÉ TAMBÉM POSSO TER ELAS)-->
<Table>
<thead>
<tr>
    <th>Estado</th>
    <th>População</th>
</tr>
</thead>
<tbody>
<tr>
    <td>São Paulo</td>
    <td>44 411 238</td>
</tr>
</tbody>
<tfoot>

</tfoot>

</Table>


</body>
</html>
