<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>
    <style>
        body{
            
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, Helvetica, sans-serif;
            margin: 40px;
            background-color: forestgreen;
            color: #000;
            align-items: center;
        }


    </style>


</head>
<body>
    <h1>EXEMPLO DE FORMULÁRIO</h1>

    <form action="cadastro.php" method="get" autocomplete="on">

        <p>
            <label for="iemail">E-mail</label>
            <input type="email" name="email" id="iemail" required
            placeholder="Digite seu melhor email" autocomplete="email" >
        </p>


        <p>
            <label for="itel">Telefone</label>
            <input type="tel" name="tel" id="itel" autocomplete="tel" required pattern="^[0-9]{4}-[0-9]{4}$" placeholder="Digite Seu Telefone!">

        </p>


        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
        
        

    </form>


</body>
</html>
