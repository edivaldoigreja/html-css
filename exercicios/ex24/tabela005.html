<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Agrupada</title>
    <style>
        bpdy{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            width: 500px;
            border-collapse: collapse;

        }
        caption{
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }
        th, td{
            border: 1px solid black;
            padding: 8px;
        }
        
            
                .cnome{
            background-color: rgba(116, 86, 65, 0.39);
        }
        .csexo{
            background-color: rgb(107, 107, 150);
        }
        .cidade{
            background-color: rgb(84, 141, 108);
        }
        .cprofi{
            background-color: blanchedalmond;
        }
    </style>
</head>
<body>
    <h1>Exercicio De Tabela</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprofi">
        </colgroup>
        <caption>cadastro</caption>
        <tr>
            <th  scope="col">nome</th>
            <th scope="col">sexo</th>
            <th scope="col">idade</th>
            <th scope="col">profisão</th>
            
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>jornalista</td>
        </tr>
        <tr>
            <td>Antonio Ivo</td>
            <td>M</td>
            <td>1</td>
            <td>Desempregado</td>
        </tr>
        <tr>
            <td>Ana Vitoria</td>
            <td>F</td>
            <td>7</td>
            <td>Desempregada</td>
        </tr>
        <tr>
            <td>Danusa Silva</td>
            <td>F</td>
            <td>20</td>
            <td>Autonoma</td>
        </tr>
        <tr >
            <td >Edivaldo Gomes</td>
            <td>M</td>
            <td>54</td>
            <td>Servidor Publico</td>
        </tr>
    </table>
</body>
</html>
